[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archagent"
version = "0.1.0"
description = "RAG-assisted multi-agent system design service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Akshat Sharma"}]
dependencies = [
  "fastapi==0.140.13",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "uvicorn[standard]==0.52.0",
  "langchain==1.3.14",
  "langchain-community==0.4.2",
  "langchain-openai==1.4.1",
  "langchain-text-splitters==1.1.2",
  "langgraph==1.2.10",
  "faiss-cpu==1.14.3",
  "tiktoken==0.13.0",
  "streamlit==1.60.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "detect-secrets==1.5.0",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
  "types-requests==2.33.0.20260712",
]

[tool.setuptools.packages.find]
include = ["backend*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"
markers = ["external: tests requiring paid/network services (excluded by default)"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "faiss_index_requirements_x"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.11"
packages = ["backend"]
strict = true
ignore_missing_imports = true
