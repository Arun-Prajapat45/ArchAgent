<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ArchAgent system architecture</title>
  <desc id="desc">A request flows from Streamlit or an API client through FastAPI into a cached LangGraph workflow with requirements, design, critique, diagram, retrieval, model provider, and optional pricing services.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <style>
      .label{font:600 16px 'Segoe UI',sans-serif;fill:#e2e8f0}.sub{font:12px 'Segoe UI',sans-serif;fill:#94a3b8}.line{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.client{fill:#083344;stroke:#22d3ee}.api{fill:#064e3b;stroke:#34d399}.agent{fill:#312e81;stroke:#a78bfa}.external{fill:#1e293b;stroke:#94a3b8}.security{fill:#881337;stroke:#fb7185}.box{stroke-width:2;rx:10}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#020617"/><rect width="1200" height="620" fill="url(#grid)"/>
  <text x="48" y="48" class="label" font-size="24">ArchAgent · Request-to-Architecture Pipeline</text>
  <text x="48" y="72" class="sub">Validated API boundary · cached graph · bounded critique loop · retrieval-augmented generation</text>

  <path class="line" d="M225 180H310"/><path class="line" d="M485 180H570"/><path class="line" d="M730 180H805"/><path class="line" d="M965 180H1040"/>
  <path class="line" d="M885 220V290H645V330"/><path class="line" d="M645 410V465"/>
  <path class="line" d="M570 370H445"/><path class="line" d="M810 370H930"/>
  <path class="line" d="M1040 370H1095V220"/>
  <path d="M770 355C810 270 810 245 730 210" stroke="#fb923c" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/>

  <rect class="box client" x="55" y="135" width="170" height="90"/><text class="label" x="140" y="173" text-anchor="middle">Streamlit UI</text><text class="sub" x="140" y="196" text-anchor="middle">or API client</text>
  <rect class="box api" x="310" y="125" width="175" height="110"/><text class="label" x="398" y="163" text-anchor="middle">FastAPI</text><text class="sub" x="398" y="187" text-anchor="middle">validation · CORS</text><text class="sub" x="398" y="207" text-anchor="middle">request ID · rate limit</text>
  <rect class="box agent" x="570" y="125" width="160" height="110"/><text class="label" x="650" y="163" text-anchor="middle">Requirements</text><text class="sub" x="650" y="188" text-anchor="middle">classify + retrieve</text><text class="sub" x="650" y="208" text-anchor="middle">Pydantic output</text>
  <rect class="box agent" x="805" y="125" width="160" height="110"/><text class="label" x="885" y="163" text-anchor="middle">HLD Generator</text><text class="sub" x="885" y="188" text-anchor="middle">structured design</text><text class="sub" x="885" y="208" text-anchor="middle">context-grounded</text>
  <rect class="box agent" x="1040" y="125" width="120" height="110"/><text class="label" x="1100" y="163" text-anchor="middle">Critic</text><text class="sub" x="1100" y="188" text-anchor="middle">review</text><text class="sub" x="1100" y="208" text-anchor="middle">max 1–5 loops</text>

  <rect class="box agent" x="570" y="330" width="160" height="80"/><text class="label" x="650" y="365" text-anchor="middle">Diagrammer</text><text class="sub" x="650" y="389" text-anchor="middle">validated Mermaid</text>
  <rect class="box external" x="270" y="325" width="175" height="90"/><text class="label" x="358" y="362" text-anchor="middle">RAG Corpus</text><text class="sub" x="358" y="386" text-anchor="middle">in-memory FAISS</text>
  <rect class="box external" x="930" y="325" width="170" height="90"/><text class="label" x="1015" y="362" text-anchor="middle">OpenRouter</text><text class="sub" x="1015" y="386" text-anchor="middle">LLM + embeddings</text>
  <rect class="box security" x="555" y="465" width="190" height="85"/><text class="label" x="650" y="500" text-anchor="middle">Response Boundary</text><text class="sub" x="650" y="524" text-anchor="middle">sanitized errors + cost</text>

  <text x="48" y="590" class="sub">Solid arrows: request/data flow · dashed orange: bounded critique feedback · external calls have explicit timeouts and safe retries</text>
</svg>
